[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatforge"
version = "0.1.0"
description = "ChatForge desktop assistant"
requires-python = ">=3.12"
dependencies = [
    "pywebview>=6.2,<7",
    "pystray>=0.19.5",
    "pillow>=12",
    "httpx>=0.28,<1",
    "pydantic>=2.9",
    "pydantic-settings>=2.15",
    "platformdirs>=4.12",
    "tomli-w>=1.2",
    "structlog>=26.1",
    "psutil>=7.2",
    "keyring>=25.7",
    "ddgs>=9.16,<10",
    "pypdf>=6.19",
    # X11 pointer reads and the global hotkey grab on Linux (pystray pulls it in there too).
    "python-xlib>=0.33; sys_platform=='linux'",
]

[project.optional-dependencies]
# COM conversion of legacy Office files (.doc/.xls/.ppt) in attachments.py; the import there is
# lazy and guarded, so without it those files are reported as unreadable.
office = [
    "pywin32>=312; sys_platform=='win32'",
]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-timeout>=2.3",
    "ruff==0.16.9",
]

[project.scripts]
chatforge = "chatforge.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chatforge"]

[tool.hatch.build.targets.wheel.force-include]
"src/chatforge/web" = "chatforge/web"
"src/chatforge/models/catalog.toml" = "chatforge/models/catalog.toml"

[tool.ruff]
line-length = 100
target-version = "py312"
# The ThemeForge bundle is vendored verbatim (tests/unit/test_theme.py checks it); never lint it.
extend-exclude = ["src/chatforge/web/static/ui-theme"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
markers = [
    "live_npu: Tests that require a real NPU and OVMS",
    "live_minimax: Tests that require a MiniMax API key",
    "ui: UI smoke tests",
]
addopts = "-m 'not live_npu and not live_minimax and not ui'"
asyncio_mode = "auto"
timeout = 120
testpaths = ["tests"]

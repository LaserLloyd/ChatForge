<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ChatForge Voice</title>
<link rel="stylesheet" href="/panel.css">
</head>
<body>
<main>
  <h1>Voice (CPU)</h1>
  <p id="state" class="state" role="status" aria-live="polite">Connecting...</p>
  <p id="notices" class="notice" hidden></p>

  <section aria-labelledby="talk-h">
    <h2 id="talk-h">Push to talk</h2>
    <p class="help">Hold the button (or the Space bar while it has focus) while you speak, release to send.
      With the push-to-talk key you do not need this page at all.</p>
    <div class="row">
      <button id="mic" type="button" class="primary">Hold to talk</button>
      <button id="stop" type="button">Stop</button>
    </div>
    <p id="heard" class="heard"></p>
  </section>

  <section aria-labelledby="models-h">
    <h2 id="models-h">Voice models</h2>
    <p id="models-line"></p>
    <ul id="missing"></ul>
    <progress id="bar" max="100" value="0" hidden></progress>
    <p id="job" class="help"></p>
    <div class="row">
      <button id="download" type="button" class="primary">Download voice models</button>
      <button id="cancel" type="button" hidden>Cancel</button>
    </div>
    <p id="size" class="help"></p>
    <details>
      <summary>Programs and licences</summary>
      <ul id="programs"></ul>
      <ul id="licences"></ul>
      <p id="attribution" class="attribution"></p>
    </details>
  </section>
</main>
<script src="/panel.js"></script>
</body>
</html>
